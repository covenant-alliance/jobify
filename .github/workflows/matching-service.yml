name: Matching service

# Only runs when the matching service or its contract changes. Jobify's own CI (ci.yml) is untouched.
on:
  push:
    branches: [ master ]
    paths: [ 'services/matching/**', 'src/main/java/com/mcverse/jobify/match/**', 'scripts/e2e-matching.sh', '.github/workflows/matching-service.yml' ]
  pull_request:
    paths: [ 'services/matching/**', 'src/main/java/com/mcverse/jobify/match/**', 'scripts/e2e-matching.sh', '.github/workflows/matching-service.yml' ]

permissions:
  contents: read

jobs:
  contract:
    name: Contract (buf lint and breaking-change check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: '1.57.0'
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Lint
        working-directory: services/matching
        run: buf lint
      - name: Breaking changes against the target branch
        # A new proto has no base to compare with: the first run on a branch that adds it passes.
        working-directory: services/matching
        run: |
          BASE="${{ github.base_ref || 'master' }}"
          git fetch --no-tags origin "$BASE"
          if git cat-file -e "origin/$BASE:services/matching/matching-api/src/main/proto/jobify/matching/v1/matching.proto" 2>/dev/null; then
            buf breaking --against "../../.git#branch=origin/$BASE,subdir=services/matching"
          else
            echo "No contract on $BASE yet; nothing to compare."
          fi

  build:
    name: Build and test (matching-api, matching-service)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify
        run: mvn -B -f services/matching/pom.xml verify

  image:
    name: Docker image builds and starts
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Compose file is valid
        env:
          POSTGRES_PASSWORD: ci-only
          JWT_SECRET: ci-only-ci-only-ci-only-ci-only-ci-only
        run: docker compose --profile matching config --quiet
      - name: Build the image
        run: docker build -t jobify-matching services/matching
      - name: Refuses to start without a token
        run: |
          if docker run --rm -e MATCHING_TOKEN= jobify-matching 2>&1 | grep -q "MATCHING_TOKEN is not set"; then
            echo "refused as expected"
          else
            echo "the container started or failed for another reason"; exit 1
          fi
      - name: Starts with a token and reports healthy
        run: |
          docker run -d --name matching -e MATCHING_TOKEN=ci-secret-ci-secret jobify-matching
          for i in $(seq 1 40); do
            if docker exec matching curl -fsS http://localhost:9091/actuator/health | grep -q '"UP"'; then
              echo "healthy after ${i} checks"; exit 0
            fi
            sleep 3
          done
          docker logs matching
          exit 1

  end-to-end:
    name: End to end (Jobify and the matching service together)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: scripts/e2e-matching.sh
