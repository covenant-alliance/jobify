name: Dependency scan

# Weekly OWASP dependency-check of the libraries we ship (docs/DEPENDENCY_SCAN.md). Deliberately NOT on pull requests or
# pushes: a newly published flaw in an old library must not block unrelated work. Needs the repository secret NVD_API_KEY.
on:
  schedule:
    - cron: '17 4 * * 1'   # Mondays 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write            # the alert issue (story T9.9)

concurrency:
  group: dependency-scan
  cancel-in-progress: false

jobs:
  scan:
    name: OWASP dependency-check (CVSS 7.0 or above fails)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Require the NVD API key
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -z "$NVD_API_KEY" ]; then
            echo "::error title=NVD_API_KEY is missing::Add the repository secret NVD_API_KEY (free key: https://nvd.nist.gov/developers/request-an-api-key). Without it the NVD download takes hours and usually fails. See docs/DEPENDENCY_SCAN.md."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # The vulnerability database is large: restore the newest copy, and save the updated one under a new key.
      - name: Cache the vulnerability database
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: odc-data-${{ github.run_id }}
          restore-keys: |
            odc-data-

      - name: Scan (mvn -Psecurity-scan)
        id: scan
        continue-on-error: true     # still upload the report and raise the alert before failing the job below
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: mvn -B -Psecurity-scan verify -DskipTests

      - name: Read the findings
        id: findings
        if: always()
        run: |
          report=target/dependency-check-report.json
          echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
          if [ ! -f "$report" ]; then
            echo "No report was produced (the scan itself failed: network, key or timeout). Not a vulnerability finding."
            echo "count=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # one line per unsuppressed finding of 7.0 or above: library, CVE, severity, score
          jq -r '[.dependencies[]? | select(.vulnerabilities != null) | .fileName as $f | .vulnerabilities[]
                  | {lib: $f, cve: .name, severity: (.severity // "n/a"), score: (.cvssv3.baseScore // .cvssv2.score // 0)}
                  | select(.score >= 7)] | sort_by(-.score) | .[]
                 | "| " + .lib + " | " + .cve + " | " + .severity + " | " + (.score|tostring) + " |"' "$report" > rows.txt
          count=$(wc -l < rows.txt | tr -d ' ')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          {
            echo "| Library | CVE | Severity | Score |"
            echo "|---|---|---|---|"
            cat rows.txt
          } > findings.md
          {
            echo "### Dependency scan: $count finding(s) of 7.0 or above"
            if [ "$count" -gt 0 ]; then cat findings.md; else echo "None."; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dependency-check-report
          path: |
            target/dependency-check-report.html
            target/dependency-check-report.json
          retention-days: 90
          if-no-files-found: warn

      # Story T9.9: findings leave a visible issue; the next failing run comments on it instead of opening another.
      - name: Open or update the alert issue
        if: steps.findings.outputs.count != '' && steps.findings.outputs.count != '0'
        uses: actions/github-script@v7
        env:
          COUNT: ${{ steps.findings.outputs.count }}
          WEEK: ${{ steps.findings.outputs.week }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const fs = require('fs');
            const table = fs.readFileSync('findings.md', 'utf8');
            const label = 'dependency-scan';
            try { await github.rest.issues.getLabel({ ...context.repo, name: label }); }
            catch (e) { await github.rest.issues.createLabel({ ...context.repo, name: label, color: 'b60205',
                        description: 'Opened by the weekly dependency scan' }); }
            const open = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', labels: label });
            const body = `${table}\n\nRun: ${process.env.RUN_URL}\n\nWhat to do: see "Response policy" in docs/DEPENDENCY_SCAN.md.`;
            if (open.data.length > 0) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: open.data[0].number,
                body: `Scan of ${process.env.WEEK}: ${process.env.COUNT} finding(s) of 7.0 or above.\n\n${body}` });
            } else {
              await github.rest.issues.create({ ...context.repo,
                title: `Dependency scan: ${process.env.COUNT} findings of 7.0 or above (week ${process.env.WEEK})`,
                labels: ['tech-debt', 'priority: P2', label], body });
            }

      - name: Note a clean scan on the open alert issue
        if: steps.scan.outcome == 'success' && steps.findings.outputs.count == '0'
        uses: actions/github-script@v7
        env:
          DATE: ${{ steps.findings.outputs.date }}
        with:
          script: |
            const open = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', labels: 'dependency-scan' });
            for (const issue of open.data) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: issue.number,
                body: `Clean as of ${process.env.DATE}: no unsuppressed finding of 7.0 or above. Close this issue when you agree.` });
            }

      - name: Fail the job when the scan failed
        if: steps.scan.outcome == 'failure'
        run: |
          echo "::error title=Dependency scan failed::Unsuppressed finding(s) of 7.0 or above, or the scan could not run. See the summary and the dependency-check-report artifact."
          exit 1
