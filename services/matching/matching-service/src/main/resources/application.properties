spring.application.name=matching
# dev is the default, like Jobify. Anything else (set SPRING_PROFILES_ACTIVE) must provide MATCHING_TOKEN.
spring.profiles.default=dev

spring.grpc.server.port=${MATCHING_GRPC_PORT:9090}
# Reflection lets grpcurl list the calls without the .proto; only on in dev.
spring.grpc.server.reflection.enabled=false

# The only HTTP port: health (and later metrics) for the platform. Nothing else is served on it.
server.port=${MATCHING_MANAGEMENT_PORT:9091}
management.endpoints.web.exposure.include=health

# The shared secret Jobify sends as "authorization: Bearer <token>". Required outside dev.
matching.auth.token=${MATCHING_TOKEN:}
