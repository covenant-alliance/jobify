spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=false
jwt.secret=PyH4fvaM86y1CtVsDs/JwHIMs8JGxMUyLBqZwvthME4=
jwt.expiration=86400000
cors.allowed-origins=http://localhost:3000

# resumes written during tests stay in the build directory
app.upload.dir=target/test-uploads

# The shared test context logs in hundreds of times from one address; the dedicated rate limit tests lower these.
app.security.auth-rate-limit.max-requests=100000
app.security.login-lock.max-failures=5
app.security.login-lock.window-minutes=10

# This file shadows src/main/resources/application.properties during tests, so settings under test must be repeated
# here. Keep in sync with the "Health" block of the main file.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=when-authorized
management.endpoint.health.roles=ADMIN
