spring.application.name=jobify
server.port=9080

# Local runs use the 'dev' profile (application-dev.properties). Deployments must set
# SPRING_PROFILES_ACTIVE to something else and provide JWT_SECRET, otherwise startup fails.
spring.profiles.default=dev

# JWT — Base64 key of at least 256 bits, e.g. `openssl rand -base64 32`
jwt.secret=${JWT_SECRET:}
jwt.expiration=86400000

cors.allowed-origins=http://localhost:3000,http://localhost:3001

# Datasource — file-based H2 for dev (persists between restarts)
spring.datasource.url=jdbc:h2:file:./data/jobifydb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.path=/h2-console

# File storage — resumes are written to <upload.dir>/<username>_resume/
app.upload.dir=./data/uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Brute-force protection (see SecurityProperties)
app.security.auth-rate-limit.max-requests=30
app.security.auth-rate-limit.window-seconds=60
app.security.login-lock.max-failures=5
app.security.login-lock.window-minutes=10
# Only enable behind a proxy that overwrites X-Forwarded-For; otherwise clients can spoof it to dodge the limit.
app.security.trust-forwarded-for=false

# Demo accounts and jobs (shared password 'password') are created in an empty database. NEVER on in production:
# the postgres profile turns it off.
app.seed.demo-data=true

# Helpers for databases created by older H2 builds (enum -> varchar, rate backfill). H2/dev only.
app.legacy-patches.enabled=true

# Swagger UI and /v3/api-docs. The postgres profile turns them off unless APP_DOCS_ENABLED=true.
app.docs.enabled=true

# First administrator for a database that has none (empty = do nothing). See docs/DEPLOYMENT.md.
app.bootstrap.admin.username=${BOOTSTRAP_ADMIN_USERNAME:}
app.bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
spring.flyway.enabled=false

# Health: anonymous callers get only {"status":"UP"}; components and details (database, disk) are for ADMIN tokens.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=when-authorized
management.endpoint.health.roles=ADMIN

# Correlation id in the plain-text log format (JSON formats carry it as the fields requestId, clientIp, user).
logging.pattern.correlation=[%X{requestId:-}] 

# Load lazy collections (skills, benefits, images) for many jobs in a few queries instead of one per job.
spring.jpa.properties.hibernate.default_batch_fetch_size=50
