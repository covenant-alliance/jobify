# Production-style profile: PostgreSQL + Flyway. Activate with SPRING_PROFILES_ACTIVE=postgres.
# Everything environment-specific comes from environment variables; there are no default secrets.
# See docs/DEPLOYMENT.md (running it) and docs/DATABASE_MIGRATION.md (moving data between databases).

# --- Datasource (required) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/jobify}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:jobify}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}

# --- Schema is owned by Flyway; Hibernate only checks that entities match it (fails fast on drift) ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/postgresql
spring.jpa.hibernate.ddl-auto=validate

# --- Things that must not exist in production ---
spring.h2.console.enabled=false
app.seed.demo-data=false
app.legacy-patches.enabled=false
app.docs.enabled=${APP_DOCS_ENABLED:false}
springdoc.api-docs.enabled=${APP_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${APP_DOCS_ENABLED:false}

# --- Deployment settings ---
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.upload.dir=${UPLOAD_DIR:/data/uploads}
# Set to true only behind a reverse proxy that overwrites X-Forwarded-For (the login rate limit depends on it).
app.security.trust-forwarded-for=${TRUST_FORWARDED_FOR:false}
